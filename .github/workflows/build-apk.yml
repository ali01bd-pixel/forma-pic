name: Build FORMA PIC APK & AAB (No Android Studio Needed)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Debug APK, Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FORMA PIC Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Project ZIP (If user uploaded FORMA_PIC_Android_Project.zip directly)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            if [ -f "FORMA_PIC_Android_Project.zip" ]; then
              echo "Found FORMA_PIC_Android_Project.zip! Extracting automatically..."
              unzip -o FORMA_PIC_Android_Project.zip
              if [ -d "FORMA_PIC" ]; then
                cp -r FORMA_PIC/* .
                cp -r FORMA_PIC/.github . 2>/dev/null || true
              fi
            elif [ -d "FORMA_PIC" ] && [ -f "FORMA_PIC/settings.gradle.kts" ]; then
              echo "Found nested FORMA_PIC folder! Moving to root..."
              cp -r FORMA_PIC/* .
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Signing Keystore (Fallback if not present)
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/forma_pic_release.jks" ]; then
            keytool -genkeypair -v \
              -keystore keystore/forma_pic_release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias forma_pic_key \
              -storepass FormaPicRelease2026! \
              -keypass FormaPicRelease2026! \
              -dname "CN=ALI, OU=FORMA PIC, O=FORMA PIC, L=City, S=State, C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Signed Release APK & Release AAB
        env:
          KEYSTORE_FILE: ../keystore/forma_pic_release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'FormaPicRelease2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'forma_pic_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'FormaPicRelease2026!' }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK (Direct Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-PIC-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-PIC-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Android App Bundle (AAB for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-PIC-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
