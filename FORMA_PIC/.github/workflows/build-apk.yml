          if [ ! -f "settings.gradle.kts" ]; then
            if [ -f "FORMA_PIC_Android_Project.zip" ]; then
              echo "Extracting uploaded FORMA_PIC_Android_Project.zip..."
              unzip -o FORMA_PIC_Android_Project.zip
              if [ -d "FORMA_PIC" ] && [ -f "FORMA_PIC/settings.gradle.kts" ]; then
                cp -r FORMA_PIC/* .
              fi
