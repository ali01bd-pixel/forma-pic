      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Release Signing Keystore Exists
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/forma_pic_release.jks" ]; then
            keytool -genkeypair -v \
              -keystore keystore/forma_pic_release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias forma_pic_key \
              -storepass FormaPicRelease2026! \
              -keypass FormaPicRelease2026! \
              -dname "CN=ALI, OU=FORMA PIC, O=FORMA PIC, L=City, S=State, C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Signed Release APK & Release AAB
        env:
          KEYSTORE_FILE: ../keystore/forma_pic_release.jks
          KEYSTORE_PASSWORD: FormaPicRelease2026!
          KEY_ALIAS: forma_pic_key
          KEY_PASSWORD: FormaPicRelease2026!
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK (Direct Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-PIC-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-PIC-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Android App Bundle (AAB for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-PIC-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
