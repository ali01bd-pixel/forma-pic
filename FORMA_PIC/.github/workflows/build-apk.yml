name: Build FORMA PIC APK & AAB (No Android Studio Needed)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Debug APK, Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Self-Contained FORMA PIC Project (Works Even If ZIP Wasn't Uploaded!)
